<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="1600" height="2400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8556d"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a8e"/>
      <stop offset="100%" stop-color="#e8556d"/>
    </linearGradient>
    <linearGradient id="line-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#e8556d"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(232,85,109,0.05)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="grid-mask" cx="50%" cy="42%" r="45%">
      <stop offset="10%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <mask id="gmask">
      <rect width="1600" height="2400" fill="url(#grid-mask)"/>
    </mask>
    <radialGradient id="orb-mask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1600" height="2400" fill="url(#bg)"/>

  <!-- 그리드 -->
  <rect width="1600" height="2400" fill="url(#grid)" mask="url(#gmask)"/>

  <!-- 글로우 오브 -->
  <ellipse cx="350" cy="600" rx="400" ry="350" fill="#e8556d" opacity=".07" filter="url(#glow)"/>
  <ellipse cx="1250" cy="900" rx="350" ry="300" fill="#6366f1" opacity=".06" filter="url(#glow)"/>
  <ellipse cx="800" cy="1300" rx="500" ry="250" fill="#ff7a8e" opacity=".03" filter="url(#glow)"/>
  <ellipse cx="400" cy="1800" rx="300" ry="250" fill="#6366f1" opacity=".04" filter="url(#glow)"/>

  <!-- 연결선 네트워크 -->
  <g opacity=".18">
    <line x1="180" y1="350" x2="500" y2="650" stroke="#e8556d" stroke-width="0.8"/>
    <line x1="500" y1="650" x2="1100" y2="500" stroke="#e8556d" stroke-width="0.8"/>
    <line x1="1100" y1="500" x2="1380" y2="800" stroke="#6366f1" stroke-width="0.8"/>
    <line x1="1380" y1="800" x2="1200" y2="1100" stroke="#6366f1" stroke-width="0.6"/>
    <line x1="180" y1="350" x2="250" y2="900" stroke="#6366f1" stroke-width="0.6"/>
    <line x1="250" y1="900" x2="700" y2="1050" stroke="#e8556d" stroke-width="0.5"/>
    <line x1="700" y1="1050" x2="1200" y2="1100" stroke="#e8556d" stroke-width="0.5"/>
    <line x1="250" y1="900" x2="400" y2="1400" stroke="#6366f1" stroke-width="0.4"/>
    <line x1="1200" y1="1100" x2="1000" y2="1500" stroke="#e8556d" stroke-width="0.4"/>
    <line x1="400" y1="1400" x2="1000" y2="1500" stroke="#6366f1" stroke-width="0.3"/>
  </g>

  <!-- 노드 -->
  <g filter="url(#glow-sm)">
    <circle cx="180" cy="350" r="5" fill="#e8556d" opacity=".7"/>
    <circle cx="180" cy="350" r="24" fill="none" stroke="#e8556d" stroke-width=".7" opacity=".25"/>

    <circle cx="500" cy="650" r="4" fill="#e8556d" opacity=".6"/>
    <circle cx="500" cy="650" r="18" fill="none" stroke="#e8556d" stroke-width=".6" opacity=".2"/>

    <circle cx="1100" cy="500" r="5" fill="#6366f1" opacity=".7"/>
    <circle cx="1100" cy="500" r="26" fill="none" stroke="#6366f1" stroke-width=".7" opacity=".25"/>

    <circle cx="1380" cy="800" r="4" fill="#6366f1" opacity=".6"/>
    <circle cx="1380" cy="800" r="20" fill="none" stroke="#6366f1" stroke-width=".6" opacity=".2"/>

    <circle cx="250" cy="900" r="3.5" fill="#e8556d" opacity=".5"/>
    <circle cx="250" cy="900" r="15" fill="none" stroke="#e8556d" stroke-width=".5" opacity=".18"/>

    <circle cx="700" cy="1050" r="3.5" fill="#ff7a8e" opacity=".5"/>
    <circle cx="700" cy="1050" r="16" fill="none" stroke="#ff7a8e" stroke-width=".5" opacity=".18"/>

    <circle cx="1200" cy="1100" r="3" fill="#6366f1" opacity=".5"/>
    <circle cx="1200" cy="1100" r="13" fill="none" stroke="#6366f1" stroke-width=".5" opacity=".15"/>

    <circle cx="400" cy="1400" r="3" fill="#6366f1" opacity=".4"/>
    <circle cx="400" cy="1400" r="12" fill="none" stroke="#6366f1" stroke-width=".5" opacity=".12"/>

    <circle cx="1000" cy="1500" r="3" fill="#e8556d" opacity=".4"/>
    <circle cx="1000" cy="1500" r="12" fill="none" stroke="#e8556d" stroke-width=".5" opacity=".12"/>
  </g>

  <!-- ===== 텍스트 콘텐츠 ===== -->

  <!-- 뱃지 -->
  <rect x="580" y="700" width="440" height="40" rx="20" fill="none" stroke="rgba(255,122,142,.3)" stroke-width="1"/>
  <text x="800" y="726" text-anchor="middle" fill="#ff7a8e" font-family="'Pretendard','Helvetica',sans-serif" font-size="14" font-weight="600" letter-spacing="3">DART INSIGHT SERIES</text>

  <!-- 메인 타이틀 -->
  <text x="800" y="870" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-weight="900" font-size="120" fill="white" letter-spacing="-4">
    <tspan>상법</tspan>
  </text>
  <text x="800" y="1000" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-weight="900" font-size="120" fill="url(#accent-grad)" letter-spacing="-2">Signal</text>

  <!-- 디바이더 -->
  <rect x="740" y="1060" width="120" height="3" fill="url(#line-h)" rx="1.5"/>

  <!-- 한글 부제 -->
  <text x="800" y="1120" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-size="32" fill="rgba(255,255,255,.55)" letter-spacing="2">기업 지배구조의</text>
  <text x="800" y="1165" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-size="32" fill="rgba(255,255,255,.55)" letter-spacing="2">소스코드를 읽는 기술</text>

  <!-- 설명 -->
  <text x="800" y="1260" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="18" fill="rgba(255,255,255,.35)" letter-spacing="0.5">숫자 너머의 구조를 읽는 법</text>
  <text x="800" y="1290" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="18" fill="rgba(255,255,255,.35)" letter-spacing="0.5">법적 리스크를 투자 시그널로 전환하는 실전 가��드</text>

  <!-- 통계 박스 -->
  <g transform="translate(420,1380)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="48" font-weight="900" fill="#ff7a8e">5</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,.3)" letter-spacing="2">CHAPTERS</text>
  </g>
  <g transform="translate(800,1380)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="48" font-weight="900" fill="#ff7a8e">25</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,.3)" letter-spacing="2">SECTIONS</text>
  </g>
  <g transform="translate(1180,1380)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="48" font-weight="900" fill="#ff7a8e">42+</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,.3)" letter-spacing="2">CASES</text>
  </g>

  <!-- 킬러 문장 -->
  <text x="800" y="1550" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-size="18" fill="rgba(255,255,255,.25)" font-style="italic" letter-spacing="0.5">"숫자를 읽는 사람은 많다. 구조를 읽는 사람은 적다.</text>
  <text x="800" y="1580" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-size="18" fill="rgba(255,255,255,.25)" font-style="italic" letter-spacing="0.5">그래서 구조에 알파가 있다."</text>

  <!-- 하단 디바이더 -->
  <rect x="300" y="2150" width="1000" height=".5" fill="rgba(232,85,109,.12)"/>

  <!-- 저자/출판 -->
  <text x="800" y="2220" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="16" fill="rgba(255,255,255,.3)" letter-spacing="1">DART Insight</text>
  <text x="800" y="2260" text-anchor="middle" font-family="'Pretendard','Helvetica',sans-serif" font-size="12" fill="rgba(255,255,255,.18)" letter-spacing="1.5">주식회사 뮤즈에���이이</text>
</svg>
