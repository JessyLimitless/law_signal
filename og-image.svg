<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 그라디언트 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="50%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8556d"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#e8556d"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <!-- 글로우 필터 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 그리드 패턴 -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(232,85,109,0.07)" stroke-width="0.5"/>
    </pattern>
    <!-- 마스크 -->
    <radialGradient id="grid-mask" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="white"/>
      <stop offset="80%" stop-color="black"/>
    </radialGradient>
    <mask id="gmask">
      <rect width="1200" height="630" fill="url(#grid-mask)"/>
    </mask>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 그리드 -->
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gmask)"/>

  <!-- 글로우 오브 -->
  <ellipse cx="280" cy="200" rx="250" ry="200" fill="#e8556d" opacity=".08" filter="url(#glow)"/>
  <ellipse cx="900" cy="420" rx="220" ry="180" fill="#6366f1" opacity=".07" filter="url(#glow)"/>
  <ellipse cx="600" cy="500" rx="300" ry="150" fill="#ff7a8e" opacity=".04" filter="url(#glow)"/>

  <!-- 연결선 -->
  <line x1="120" y1="140" x2="380" y2="280" stroke="#e8556d" stroke-width="0.6" opacity=".2"/>
  <line x1="380" y1="280" x2="820" y2="180" stroke="#e8556d" stroke-width="0.6" opacity=".15"/>
  <line x1="820" y1="180" x2="1050" y2="350" stroke="#6366f1" stroke-width="0.6" opacity=".2"/>
  <line x1="1050" y1="350" x2="900" y2="520" stroke="#6366f1" stroke-width="0.5" opacity=".12"/>
  <line x1="120" y1="140" x2="200" y2="450" stroke="#6366f1" stroke-width="0.5" opacity=".12"/>
  <line x1="200" y1="450" x2="600" y2="520" stroke="#e8556d" stroke-width="0.4" opacity=".1"/>
  <line x1="600" y1="520" x2="900" y2="520" stroke="#e8556d" stroke-width="0.4" opacity=".1"/>

  <!-- 노드 -->
  <g filter="url(#glow-sm)">
    <circle cx="120" cy="140" r="4" fill="#e8556d" opacity=".7"/>
    <circle cx="120" cy="140" r="18" fill="none" stroke="#e8556d" stroke-width=".6" opacity=".25"/>

    <circle cx="380" cy="280" r="3" fill="#e8556d" opacity=".6"/>
    <circle cx="380" cy="280" r="14" fill="none" stroke="#e8556d" stroke-width=".5" opacity=".2"/>

    <circle cx="820" cy="180" r="4" fill="#6366f1" opacity=".7"/>
    <circle cx="820" cy="180" r="20" fill="none" stroke="#6366f1" stroke-width=".6" opacity=".25"/>

    <circle cx="1050" cy="350" r="3" fill="#6366f1" opacity=".6"/>
    <circle cx="1050" cy="350" r="15" fill="none" stroke="#6366f1" stroke-width=".5" opacity=".2"/>

    <circle cx="200" cy="450" r="3" fill="#e8556d" opacity=".5"/>
    <circle cx="200" cy="450" r="12" fill="none" stroke="#e8556d" stroke-width=".5" opacity=".18"/>

    <circle cx="600" cy="520" r="3" fill="#ff7a8e" opacity=".5"/>
    <circle cx="600" cy="520" r="13" fill="none" stroke="#ff7a8e" stroke-width=".5" opacity=".18"/>

    <circle cx="900" cy="520" r="2.5" fill="#6366f1" opacity=".4"/>
    <circle cx="900" cy="520" r="10" fill="none" stroke="#6366f1" stroke-width=".5" opacity=".15"/>
  </g>

  <!-- 뱃지 -->
  <rect x="480" y="140" width="240" height="28" rx="14" fill="none" stroke="rgba(255,122,142,.35)" stroke-width="1"/>
  <text x="600" y="159" text-anchor="middle" fill="#ff7a8e" font-family="'Pretendard','Arial',sans-serif" font-size="11" font-weight="600" letter-spacing="2">DART INSIGHT SERIES</text>

  <!-- 메인 타이틀 -->
  <text x="600" y="248" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-weight="900" font-size="62" fill="white" letter-spacing="-2">
    <tspan>상법 </tspan><tspan fill="url(#accent-grad)">Signal</tspan>
  </text>

  <!-- 한글 부제 -->
  <text x="600" y="295" text-anchor="middle" font-family="'Noto Serif KR','Georgia',serif" font-size="20" fill="rgba(255,255,255,.5)" letter-spacing="1">기업 지배구조의 소스코드를 읽는 기술</text>

  <!-- 디바이더 -->
  <rect x="576" y="320" width="48" height="2" fill="url(#line-grad)" rx="1"/>

  <!-- 서브타이틀 -->
  <text x="600" y="360" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="14" fill="rgba(255,255,255,.4)" letter-spacing="0.5">숫자 너머의 구조를 읽는 법</text>
  <text x="600" y="382" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="14" fill="rgba(255,255,255,.4)" letter-spacing="0.5">법적 리스크를 투자 시그널로 전환하는 실전 가이드</text>

  <!-- 통계 -->
  <g transform="translate(390,420)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="32" font-weight="900" fill="#ff7a8e">5</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,.35)" letter-spacing="1.5">CHAPTERS</text>
  </g>
  <g transform="translate(600,420)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="32" font-weight="900" fill="#ff7a8e">25</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,.35)" letter-spacing="1.5">SECTIONS</text>
  </g>
  <g transform="translate(810,420)">
    <text x="0" y="0" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="32" font-weight="900" fill="#ff7a8e">42+</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,.35)" letter-spacing="1.5">CASES</text>
  </g>

  <!-- 하단 메타 -->
  <text x="600" y="530" text-anchor="middle" font-family="'Pretendard','Arial',sans-serif" font-size="11" fill="rgba(255,255,255,.22)" letter-spacing="1">DART Insight · 주식회사 뮤즈에아이이</text>

  <!-- 하단 라인 -->
  <rect x="200" y="560" width="800" height=".5" fill="rgba(232,85,109,.1)"/>
</svg>
